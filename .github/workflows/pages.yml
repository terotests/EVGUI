# Build the EVG UI gallery and deploy it to GitHub Pages
# (https://terotests.github.io/EVGUI/).
#
#   /        redirects to /demo/ and keeps ?demo= and #hash
#   /demo/   the tree-literal demos, painted by EVG's WebGL painter
#   /web/    Radix on the left, Ranger on the right, the behaviour trace below
#
# The demos are Ranger source. The controllers are this repository's src/;
# the EVG library (lib/evg) and the conformance harness the playground runs
# (gallery/ui/conformance) come from Ranger, and the compiler committed there
# (dist/rgrc.js) compiles everything, so no compiler build is needed: a sparse,
# shallow checkout of the parts the build reads is enough, and this repository
# is checked out at gallery/evgui inside it, where the scripts expect to be.
name: Deploy EVGUI to GitHub Pages

# Every push is built and tested; only main is deployed.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ranger_ref:
        description: "Ranger branch, tag or commit to build with"
        required: false
        default: ""

env:
  # Pinned to the Ranger commit that adds what the demos use from lib/evg
  # (a11yDescribedBy, the spinbutton role, willReadFrequently on the text
  # atlas) until that is merged to master; then set this back to 'master'.
  RANGER_REF: ${{ inputs.ranger_ref || '57260750ae03b9d5705daa01c49e6c51679d0cab' }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Ranger (compiler, EVG, conformance harness)
        uses: actions/checkout@v4
        with:
          repository: terotests/Ranger
          ref: ${{ env.RANGER_REF }}
          path: ranger
          fetch-depth: 1
          sparse-checkout: |
            compiler
            lib
            dist
            gallery/ui/conformance
            gallery/vela
            gallery/game_engine/ui
            gallery/office/text
            gallery/pdf_writer/src
            gallery/mfiles

      - name: Checkout EVGUI
        uses: actions/checkout@v4
        with:
          path: ranger/gallery/evgui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # esbuild, playwright-core and the Radix reference host the playground
      # bundles. One install serves the pages, the gate and the smoke test.
      - name: Install the conformance host
        run: node ranger/gallery/evgui/scripts/run.mjs ui:conformance:install

      - name: Install Chromium
        working-directory: ranger/gallery/ui/conformance/dom
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.* \
                     /etc/apt/sources.list.d/microsoft-prod.*
          npx playwright-core install --with-deps chromium ||
            npx playwright-core install chromium

      - name: Build the pages
        run: |
          node ranger/gallery/evgui/scripts/run.mjs ui:pages:build
          node ranger/gallery/evgui/web/verify-out.mjs ranger/gallery/evgui/web/dist

      # The files being there is not the page: this serves the artifact the
      # way GitHub Pages will and checks that / lands on the demos and /web/
      # paints the playground.
      - name: Smoke test the published tree
        run: node ranger/gallery/evgui/scripts/run.mjs --no-overlay ui:pages:smoke

      - name: Demo suites
        run: bash ranger/gallery/evgui/scripts/gate.sh --prebuilt

      - name: Collect the site
        run: cp -r ranger/gallery/evgui/web/dist _site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
