# Build the EVG UI gallery and deploy it to GitHub Pages
# (https://terotests.github.io/EVGUI/).
#
#   /        redirects to /demo/ and keeps ?demo= and #hash
#   /demo/   the tree-literal demos, painted by EVG's WebGL painter
#   /web/    Radix on the left, Ranger on the right, the behaviour trace below
#
# The demos are Ranger source. They import the controllers from Ranger's
# gallery/ui/src and the EVG library from lib/evg, and are compiled by the
# compiler committed in Ranger (dist/rgrc.js), so no compiler build is needed:
# a sparse, shallow checkout of the parts the build reads is enough, and
# scripts/run.mjs copies this repository's demo/, web/ and bench/ into its
# gallery/ui/, where the scripts expect to be.
name: Deploy EVGUI to GitHub Pages

# Every push is built and tested; only the default branch is deployed.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ranger_ref:
        description: "Ranger branch, tag or commit to build with"
        required: false
        default: ""

env:
  RANGER_REF: ${{ inputs.ranger_ref || 'master' }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Ranger (compiler, libraries, controllers)
        uses: actions/checkout@v4
        with:
          repository: terotests/Ranger
          ref: ${{ env.RANGER_REF }}
          path: ranger
          fetch-depth: 1
          sparse-checkout: |
            compiler
            lib
            dist
            gallery/ui
            gallery/vela
            gallery/game_engine/ui
            gallery/office/text
            gallery/pdf_writer/src

      - name: Checkout EVGUI
        uses: actions/checkout@v4
        with:
          path: evgui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # esbuild, playwright-core and the Radix reference host the playground
      # bundles. One install serves the pages, the gate and the smoke test.
      - name: Install the conformance host
        run: node evgui/scripts/run.mjs --ranger ranger ui:conformance:install

      - name: Install Chromium
        working-directory: ranger/gallery/ui/conformance/dom
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.* \
                     /etc/apt/sources.list.d/microsoft-prod.*
          npx playwright-core install --with-deps chromium ||
            npx playwright-core install chromium

      - name: Build the pages
        run: |
          node evgui/scripts/run.mjs --ranger ranger ui:pages:build
          node ranger/gallery/ui/web/verify-out.mjs ranger/gallery/ui/web/dist

      # The files being there is not the page: this serves the artifact the
      # way GitHub Pages will and checks that / lands on the demos and /web/
      # paints the playground.
      - name: Smoke test the published tree
        run: node evgui/scripts/run.mjs --ranger ranger --no-overlay ui:pages:smoke

      - name: Demo suites
        run: bash evgui/scripts/gate.sh --ranger ranger

      - name: Collect the site
        run: cp -r ranger/gallery/ui/web/dist _site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
